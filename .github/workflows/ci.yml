name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpp:
    name: C++ tests (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [test, asan, tsan]
    steps:
      - uses: actions/checkout@v4
      - name: Install zlib
        run: sudo apt-get update -q && sudo apt-get install -y zlib1g-dev
      - name: Allow ThreadSanitizer's memory layout
        if: matrix.check == 'tsan'
        # Newer runner kernels randomize more address bits than TSan supports.
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: make ${{ matrix.check }}
        working-directory: cpp
        run: make ${{ matrix.check }}

  cpp-cmake:
    name: C++ build with CMake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y zlib1g-dev
      - run: cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j
      - run: ./build/tests
      - run: cd cpp && ../build/itch_tests

  wasm:
    name: Order book in WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt-get update -q && sudo apt-get install -y clang lld
      - name: Build docs/orderbook.wasm and check it against the native build
        working-directory: cpp
        run: make wasm-test

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pure-Python order book and engine
        run: python -m unittest -v test_orderbook test_engine
      - name: Install backtest dependencies
        run: pip install numpy pandas matplotlib scikit-learn
      - name: Build obfast (C++ book as a Python module) and the C++ model runtime
        run: make -C cpp python ml
      - name: Binding and backtest tests
        run: python -m unittest discover -s backtest -v
      - name: Backtest smoke run
        run: python backtest/run_backtest.py --quick
